; Smart picture frame firmware for the Freenove FNK0086 ESP32-S3 Development Kit
; (ESP32-S3-WROOM-1 N8R8: 8 MB flash, 8 MB OPI PSRAM). See README.md.
[env:frame]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
upload_port = COM5
upload_speed = 921600
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bitbank2/JPEGDEC@^1.6.2
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    ; LVGL: use include/lv_conf.h (also for the library build itself)
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    ; TFT_eSPI: Freenove FNK0086A 2.8" 240x320 ST7789 (CFG1)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_MOSI=20
    -DTFT_SCLK=21
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=80000000
    -DUSE_HSPI_PORT=1
